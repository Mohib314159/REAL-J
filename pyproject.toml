[project]
name = "context-audit-mcp"
version = "0.1.0"
description = "Audit MCP tool manifests for vocabulary that leaks context to an agent"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0", "pydantic>=2.0"]

[project.optional-dependencies]
semantic = ["pydantic-ai>=0.0.20"]
dev = ["pytest>=8.0"]

[project.scripts]
context-audit-mcp = "context_audit.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
